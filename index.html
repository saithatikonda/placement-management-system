<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Placement Command — College Placement Management System (PMS)</title>
    <meta name="description" content="Production-grade College Placement Management System featuring obsidian emerald theme, CGPA eligibility predictor, company recruiter console, and institutional shortlisting cockpit." />
    
    <!-- Modern Typography: Plus Jakarta Sans, Inter, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Design System Stylesheet -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Subtle Ambient Lighting Backlight Flares in Opposite Corners -->
    <div class="ambient-lighting-layer" aria-hidden="true">
      <div class="ambient-flare-amber"></div>
      <div class="ambient-flare-emerald"></div>
    </div>

    <!-- 1. TOP NAVIGATION BAR (SEMANTIC LANDMARK) -->
    <header class="top-nav" role="banner">
      <!-- Brand Lockup -->
      <div class="brand-lockup">
        <div class="brand-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
            <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
          </svg>
        </div>
        <div class="brand-text">
          <div style="display: flex; align-items: center; gap: 8px;">
            <h1>Placement Command</h1>
            <span id="activePortalLabel" class="tag-pill" style="font-size: 0.65rem; text-transform: uppercase;">Student Portal</span>
          </div>
          <p>Institutional Placement Management System (PMS)</p>
        </div>
      </div>

      <!-- Center: Role Switcher Pill Bar -->
      <nav class="role-pill-bar" role="tablist" aria-label="Portal Mode Selection">
        <button id="portalTabStudent" class="role-tab-btn active-student" role="tab" aria-selected="true" aria-controls="studentPortalView">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <span>Student Portal</span>
        </button>

        <button id="portalTabCompany" class="role-tab-btn" role="tab" aria-selected="false" aria-controls="companyPortalView">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
          <span>Company Console</span>
        </button>

        <button id="portalTabAdmin" class="role-tab-btn" role="tab" aria-selected="false" aria-controls="adminPortalView">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
          <span>TPO Admin</span>
        </button>
      </nav>

      <!-- Right Header Actions: Status & Search Cmd+K -->
      <div style="display: flex; align-items: center; gap: 14px;">
        <!-- Spring Boot Connection Status Indicator -->
        <div id="backendStatusPill" class="status-pill mock" title="Target: http://localhost:8080/api">
          <span class="ctc-pulse-dot"></span>
          <span>Mock Mode (Auto Fallback)</span>
        </div>

        <!-- Command Palette Trigger -->
        <button id="openCmdPaletteBtn" class="btn btn-glass btn-sm" aria-label="Search and Command Palette" title="Command Palette (Cmd+K)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <span style="font-size: 0.75rem;">Search</span>
          <kbd style="font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; padding: 2px 5px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; margin-left: 4px;">⌘K</kbd>
        </button>
      </div>
    </header>

    <!-- 2. MAIN APPLICATION CONTENT LANDMARK -->
    <main class="portal-view-container" style="max-width: 1380px; margin: 0 auto; padding: 28px 24px;" role="main">
      <!-- A. STUDENT PORTAL VIEW CONTAINER -->
      <section id="studentPortalView" class="portal-view active" role="tabpanel" aria-label="Student Portal">
        <!-- Rendered dynamically by js/student.js -->
      </section>

      <!-- B. COMPANY / RECRUITER PORTAL VIEW CONTAINER -->
      <section id="companyPortalView" class="portal-view" role="tabpanel" aria-label="Company Portal">
        <!-- Rendered dynamically by js/company.js -->
      </section>

      <!-- C. TPO ADMINISTRATION VIEW CONTAINER -->
      <section id="adminPortalView" class="portal-view" role="tabpanel" aria-label="TPO Administration">
        <!-- Rendered dynamically by js/app.js -->
      </section>
    </main>

    <!-- 3. POST NEW JOB DRIVE MODAL -->
    <div id="postJobModalOverlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="postJobModalTitle">
      <div class="modal-container">
        <div class="modal-header">
          <div style="display: flex; align-items: center; gap: 10px;">
            <span style="font-size: 1.3rem;">🚀</span>
            <h3 id="postJobModalTitle">Create Campus Recruitment Drive</h3>
          </div>
          <button id="closePostJobModalBtn" class="modal-close-btn" aria-label="Close modal">✕</button>
        </div>

        <form id="postJobForm">
          <div class="modal-body">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
              <div class="form-group">
                <label class="form-label" for="jobCompanyNameInput">Company Name</label>
                <input type="text" id="jobCompanyNameInput" class="form-control" required placeholder="e.g. Microsoft India" value="Stripe India" />
              </div>

              <div class="form-group">
                <label class="form-label" for="jobRoleInput">Job Role Title</label>
                <input type="text" id="jobRoleInput" class="form-control" required placeholder="e.g. Software Engineer I" value="Backend Infrastructure Engineer" />
              </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
              <div class="form-group">
                <label class="form-label" for="jobCtcInput">Annual Compensation (CTC)</label>
                <input type="text" id="jobCtcInput" class="form-control" required placeholder="e.g. 35.0 LPA" value="34.5 LPA" />
              </div>

              <div class="form-group">
                <label class="form-label" for="jobMinCgpaInput">Minimum Cutoff CGPA</label>
                <input type="number" id="jobMinCgpaInput" class="form-control" step="0.1" min="5.0" max="10.0" value="8.0" required />
              </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
              <div class="form-group">
                <label class="form-label" for="jobCategorySelect">Drive Category</label>
                <select id="jobCategorySelect" class="form-control">
                  <option value="Super Dream">Super Dream (> 20 LPA)</option>
                  <option value="Dream">Dream (10 - 20 LPA)</option>
                  <option value="Tier-1 Core">Tier-1 Core (6 - 10 LPA)</option>
                </select>
              </div>

              <div class="form-group">
                <label class="form-label" for="jobWorkModeSelect">Work Mode</label>
                <select id="jobWorkModeSelect" class="form-control">
                  <option value="Hybrid">Hybrid</option>
                  <option value="On-Campus">On-Campus</option>
                  <option value="Remote">Remote</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="jobLocationInput">Work Location</label>
              <input type="text" id="jobLocationInput" class="form-control" value="Bengaluru / Hyderabad" />
            </div>

            <div class="form-group">
              <label class="form-label" for="jobDescriptionInput">Role Overview & Responsibilities</label>
              <textarea id="jobDescriptionInput" class="form-control" rows="3" placeholder="Brief outline of mission and tech stack...">Developing core distributed payment ledger pipelines and high-throughput real-time financial settlement engines in Java and Go.</textarea>
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" id="cancelPostJobModalBtn" class="btn btn-glass">Cancel</button>
            <button type="submit" class="btn btn-amber">Publish Recruitment Drive</button>
          </div>
        </form>
      </div>
    </div>

    <!-- 4. VERIFIED DOSSIER / RESUME MODAL -->
    <div id="resumeModalOverlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="resumeModalTitle">
      <div class="modal-container">
        <div class="modal-header">
          <h3 id="resumeModalTitle">Candidate Academic Dossier</h3>
          <button id="closeResumeModalBtn" class="modal-close-btn" aria-label="Close modal">✕</button>
        </div>
        <div class="modal-body" id="resumeModalBody">
          <!-- Rendered dynamically by js/app.js -->
        </div>
      </div>
    </div>

    <!-- 5. GLOBAL COMMAND PALETTE MODAL (CMD+K) -->
    <div id="commandPaletteOverlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="cmdPaletteTitle">
      <div class="modal-container" style="max-width: 580px;">
        <div style="padding: 16px 20px; border-bottom: 1px solid rgba(16, 185, 129, 0.15); display: flex; align-items: center; gap: 12px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--accent-amber-light);"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input 
            type="text" 
            id="commandPaletteInput" 
            class="form-control" 
            placeholder="Search drives, candidate names, roll numbers..."
            style="border: none; background: transparent; font-size: 0.95rem; padding: 0; box-shadow: none;"
          />
          <button id="closeCommandPaletteBtn" class="modal-close-btn" style="width: 28px; height: 28px; font-size: 0.75rem;" aria-label="Close">ESC</button>
        </div>
        <div class="modal-body" id="commandPaletteResultsList" style="padding: 18px 20px; max-height: 400px; overflow-y: auto;">
          <!-- Dynamically populated -->
        </div>
      </div>
    </div>

    <!-- 6. GLOBAL NOTIFICATION TOAST -->
    <div id="toastNotification" role="alert" aria-live="polite">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="color: var(--accent-emerald-primary);"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
      <span id="toastNotificationText" style="font-size: 0.825rem; font-weight: 700;">Action completed</span>
    </div>

    <!-- Modular Application Logic Entrypoint -->
    <script type="module" src="js/app.js"></script>
  </body>
</html>
